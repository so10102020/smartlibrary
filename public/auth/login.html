<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>ログイン | LibraryCirculationSystem</title>
    <link rel="stylesheet" href="../styles/styles.css">

    <!-- Firebase設定を先に読み込む -->
    <script src="../lib/firebase-config.js"></script>
    
    <!-- Firebase SDKs（deferを削除して同期読み込み） -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    
    <!-- Firebase初期化 -->
    <script src="../lib/firebase-init.js"></script>

    <!-- ログインスクリプト（絶対パスで指定） -->
    <script defer src="/auth/login.js"></script>
  </head>
  <body>
    <div class="auth-wrapper">
      <div class="auth-container">
        <!-- ヘッダー（シンプル） -->
        <div class="auth-header">
          <h1 class="auth-title">ログイン</h1>
          <p class="auth-subtitle">アカウント情報を入力してください</p>
        </div>

        <!-- ログインフォーム -->
        <div class="auth-card">
          <form class="auth-form" onsubmit="return false;">
            <div class="form-group">
              <label for="loginEmail" class="form-label">メールアドレス</label>
              <div class="input-wrapper">
                <input 
                  id="loginEmail" 
                  type="text" 
                  placeholder="メールアドレス" 
                  autocomplete="email"
                  class="auth-input"
                  required
                >
              </div>
            </div>

            <div class="form-group">
              <label for="loginPassword" class="form-label">パスワード</label>
              <div class="input-wrapper">
                <input 
                  id="loginPassword" 
                  type="password" 
                  placeholder="パスワード" 
                  autocomplete="current-password"
                  class="auth-input"
                  required
                >
              </div>
            </div>

            <!-- ログイン状態を保持するチェックボックス -->
            <div class="form-group">
              <label class="checkbox-label">
                <input 
                  id="rememberMe" 
                  type="checkbox" 
                  checked
                >
                <span>ログイン状態を保持する</span>
              </label>
            </div>

            <div class="form-actions">
              <button id="loginBtn" type="submit" class="auth-btn primary">ログイン</button>
              <div id="loginMsg" class="auth-message"></div>
            </div>
          </form>

          <div class="auth-options">
            <button class="link-btn" id="resetBtn" type="button">パスワードをお忘れの方</button>
          </div>
        </div>

        <!-- フッター（シンプル） -->
        <div class="auth-footer">
          <p class="auth-footer-text">
            アカウントをお持ちでない方は <a href="signup.html" class="auth-link">新規登録</a>
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
